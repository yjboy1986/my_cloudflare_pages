<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, World! — msfabrica.jp</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f6f7f9;
    color: #1a1d21;
    padding: 2rem 1rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14171a; color: #eceff1; }
  }
  main { text-align: center; }
  h1 {
    font-size: clamp(2.2rem, 8vw, 4.5rem);
    margin: 0 0 0.5rem;
    line-height: 1.2;
  }
  p { margin: 0; font-size: 1.1rem; opacity: 0.75; }
  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    max-width: 640px;
  }
  nav button {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid currentColor;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    opacity: 0.65;
  }
  nav button:hover { opacity: 1; }
  nav button[aria-pressed="true"] {
    opacity: 1;
    font-weight: 700;
    background: #f6821f;
    border-color: #f6821f;
    color: #fff;
  }
  #speak {
    font: inherit;
    font-size: 1rem;
    margin-top: 1.25rem;
    padding: 0.55rem 1.4rem;
    border: none;
    border-radius: 999px;
    background: #f6821f;
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  #speak:hover { filter: brightness(1.08); }
  #speak svg { width: 1.1em; height: 1.1em; fill: currentColor; flex: none; }
  .site-nav { display: flex; justify-content: center; }
  .site-nav a {
    font-size: 0.95rem;
    padding: 0.5rem 1.2rem;
    border: 1px solid currentColor;
    border-radius: 999px;
    color: inherit;
    text-decoration: none;
    opacity: 0.8;
  }
  .site-nav a:hover { opacity: 1; border-color: #f6821f; color: #f6821f; }
</style>
</head>
<body>
<main>
  <h1 id="greeting">こんにちは、世界！</h1>
  <p id="subtitle">msfabrica.jp へようこそ</p>
  <button id="speak" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 8.6a4.5 4.5 0 0 1 0 6.8l-1-1.2a3.2 3.2 0 0 0 0-4.4l1-1.2z"/><path d="M18.8 5.8a8 8 0 0 1 0 12.4l-1-1.2a6.7 6.7 0 0 0 0-10l1-1.2z"/></svg>
    <span id="speak-label">読み上げ</span>
  </button>
</main>
<nav class="site-nav" aria-label="サイト内リンク">
  <a href="data-analysis/">データ分析</a>
</nav>
<nav id="langs" aria-label="Language"></nav>
<script>
  const messages = {
    "ja":    { greeting: "こんにちは、世界！",        subtitle: "msfabrica.jp へようこそ",        label: "日本語" },
    "en":    { greeting: "Hello, World!",             subtitle: "Welcome to msfabrica.jp",        label: "English" },
    "zh-CN": { greeting: "你好，世界！",               subtitle: "欢迎来到 msfabrica.jp",          label: "简体中文" },
    "zh-TW": { greeting: "你好，世界！",               subtitle: "歡迎來到 msfabrica.jp",          label: "繁體中文" },
    "ko":    { greeting: "안녕하세요, 세상!",          subtitle: "msfabrica.jp에 오신 것을 환영합니다", label: "한국어" },
    "es":    { greeting: "¡Hola, Mundo!",             subtitle: "Bienvenido a msfabrica.jp",      label: "Español" },
    "fr":    { greeting: "Bonjour, le Monde !",       subtitle: "Bienvenue sur msfabrica.jp",     label: "Français" },
    "de":    { greeting: "Hallo, Welt!",              subtitle: "Willkommen bei msfabrica.jp",    label: "Deutsch" },
    "it":    { greeting: "Ciao, Mondo!",              subtitle: "Benvenuto su msfabrica.jp",      label: "Italiano" },
    "pt":    { greeting: "Olá, Mundo!",               subtitle: "Bem-vindo ao msfabrica.jp",      label: "Português" },
    "nl":    { greeting: "Hallo, Wereld!",            subtitle: "Welkom bij msfabrica.jp",        label: "Nederlands" },
    "ru":    { greeting: "Привет, мир!",              subtitle: "Добро пожаловать на msfabrica.jp", label: "Русский" },
    "ar":    { greeting: "مرحباً بالعالم!",            subtitle: "مرحباً بك في msfabrica.jp",        label: "العربية", dir: "rtl" },
    "hi":    { greeting: "नमस्ते, दुनिया!",             subtitle: "msfabrica.jp में आपका स्वागत है",    label: "हिन्दी" },
    "th":    { greeting: "สวัสดี, โลก!",               subtitle: "ยินดีต้อนรับสู่ msfabrica.jp",      label: "ไทย" },
    "vi":    { greeting: "Xin chào, Thế giới!",       subtitle: "Chào mừng đến với msfabrica.jp", label: "Tiếng Việt" }
  };

  const listenLabels = {
    "ja": "読み上げ", "en": "Listen", "zh-CN": "朗读", "zh-TW": "朗讀",
    "ko": "읽어주기", "es": "Escuchar", "fr": "Écouter", "de": "Anhören",
    "it": "Ascolta", "pt": "Ouvir", "nl": "Luisteren", "ru": "Слушать",
    "ar": "استمع", "hi": "सुनें", "th": "ฟัง", "vi": "Nghe"
  };

  const nav = document.getElementById("langs");
  const greetingEl = document.getElementById("greeting");
  const subtitleEl = document.getElementById("subtitle");
  const speakBtn = document.getElementById("speak");
  const speakLabel = document.getElementById("speak-label");
  let currentLang = "ja";

  function speak() {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const m = messages[currentLang] || messages["en"];
    const utter = new SpeechSynthesisUtterance(m.greeting + " " + m.subtitle);
    utter.lang = currentLang;
    const base = currentLang.split("-")[0];
    const voice = speechSynthesis.getVoices().find(v => v.lang === currentLang)
      || speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith(base));
    if (voice) utter.voice = voice;
    speechSynthesis.speak(utter);
  }
  speakBtn.addEventListener("click", speak);
  if ("speechSynthesis" in window) {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener("voiceschanged", () => speechSynthesis.getVoices());
  } else {
    speakBtn.style.display = "none";
  }

  function setLang(code) {
    const m = messages[code] || messages["en"];
    greetingEl.textContent = m.greeting;
    subtitleEl.textContent = m.subtitle;
    document.documentElement.lang = code;
    document.documentElement.dir = m.dir || "ltr";
    document.title = m.greeting + " — msfabrica.jp";
    currentLang = code;
    speakLabel.textContent = listenLabels[code] || "Listen";
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    for (const btn of nav.children) {
      btn.setAttribute("aria-pressed", btn.dataset.lang === code ? "true" : "false");
    }
    try { localStorage.setItem("lang", code); } catch (e) {}
  }

  for (const [code, m] of Object.entries(messages)) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = m.label;
    btn.dataset.lang = code;
    btn.setAttribute("aria-pressed", "false");
    btn.addEventListener("click", () => setLang(code));
    nav.appendChild(btn);
  }

  // 初期表示: 前回の選択 → ブラウザの言語 → 英語
  let initial = null;
  try { initial = localStorage.getItem("lang"); } catch (e) {}
  if (!initial || !messages[initial]) {
    if (messages[navigator.language]) {
      initial = navigator.language;
    } else {
      const base = navigator.language.split("-")[0];
      initial = Object.keys(messages).find(k => k === base || k.startsWith(base + "-")) || "en";
    }
  }
  setLang(initial);
</script>
</body>
</html>
